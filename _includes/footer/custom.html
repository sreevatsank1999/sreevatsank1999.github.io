<!-- BibTeX toggle and copy buttons on publication cards -->
<script>
  document.addEventListener("click", function (event) {
    var toggle = event.target.closest("[data-bibtex-toggle]");
    if (toggle) {
      var panel = document.getElementById(toggle.getAttribute("aria-controls"));
      var opening = panel.hidden;
      panel.hidden = !opening;
      toggle.setAttribute("aria-expanded", opening ? "true" : "false");
      return;
    }
    var copy = event.target.closest("[data-bibtex-copy]");
    if (copy && navigator.clipboard) {
      navigator.clipboard.writeText(copy.nextElementSibling.textContent).then(function () {
        copy.textContent = "Copied";
        setTimeout(function () { copy.textContent = "Copy"; }, 1500);
      });
    }
  });
</script>

<!-- Open an expandable research box when a link points to it -->
<script>
  (function () {
    function openLinkedBox() {
      var target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target && target.tagName === "DETAILS") {
        target.open = true;
        target.scrollIntoView();
      }
    }
    window.addEventListener("hashchange", openLinkedBox);
    openLinkedBox();
  })();
</script>

<!-- end custom footer snippets -->
